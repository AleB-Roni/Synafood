<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F3336">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Synafood">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Synafood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte wie ein langer Thermo-Kassenzettel auf dunklem Kassentresen; unten das Kassendisplay mit deiner Summe. */
:root{
  --counter:#2F3336; --paper:#FBF9F3; --ink:#1D1C1A; --faded:#77736B; --line:#BDB8AC;
  --red:#C2372B; --hi:#F3E27A; --ok:#2E6B3F;
  --font-display:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-body:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --z:7px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--counter); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size:4px 4px;
}
body.has-bar{padding-bottom:calc(118px + env(safe-area-inset-bottom))}
.mono{font-family:var(--font-mono)}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; line-height:1.2; text-transform:uppercase; letter-spacing:.04em}
h1{font-size:1.35rem; font-weight:700}
h2{font-size:.95rem; font-weight:700}
a{color:var(--ink)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px dashed var(--red); outline-offset:3px}
.wrap{max-width:560px; margin:0 auto; padding:0 16px}

/* Papier mit gezackten Abrisskanten */
.paper{
  background:var(--paper); position:relative; padding:calc(var(--z) + 16px) 18px;
  -webkit-mask:conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/calc(2*var(--z)) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x;
  mask:conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/calc(2*var(--z)) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x;
}
.rule{border-top:2px dashed var(--line); margin:14px 0}
.rule.double{border-top:3px double var(--ink); margin:12px 0 10px}

/* Kopf */
.top{display:grid; justify-items:center; gap:6px; text-align:center; margin:14px 0 12px}
.brand{text-decoration:none; color:var(--ink); display:grid; gap:2px}
.brand-name{font-weight:700; font-size:1.7rem; letter-spacing:.28em; padding-left:.28em}
.brand-sub{font-size:.75rem; color:var(--faded); letter-spacing:.12em}
.me-pill{border:0; background:none; cursor:pointer; font-size:.82rem; color:var(--faded); padding:4px 8px; letter-spacing:.04em}
.me-pill b{color:var(--ink)}
.me-pill .u{text-decoration:underline; text-underline-offset:3px}

.banner{font-size:.78rem; color:var(--ink); background:var(--hi); padding:8px 12px; margin:0 0 12px; border-radius:2px}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 14px}
.tabs a{text-align:center; padding:9px 8px; text-decoration:none; color:var(--paper); font-weight:600; font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; border:1.5px dashed rgba(255,255,255,.35); border-radius:4px}
.tabs a[aria-current="page"]{background:var(--paper); color:var(--ink); border-style:solid; border-color:var(--paper)}

/* Buttons wie Kassentasten */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--ink); background:var(--paper); border-radius:4px; padding:10px 14px; font-weight:700; cursor:pointer; text-decoration:none; color:var(--ink); min-height:44px; text-transform:uppercase; letter-spacing:.05em; font-size:.82rem; box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--ink); color:var(--paper)}
.btn.ghost{box-shadow:none; border-style:dashed}
.btn.danger{color:var(--red); border-color:var(--red); box-shadow:0 3px 0 var(--red)}
.btn.small{min-height:32px; padding:5px 10px; font-size:.74rem; box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.counter-btns .btn{border-color:var(--paper); box-shadow:0 3px 0 #0008}
.counter-btns .btn:not(.primary){background:transparent; color:var(--paper)}
.counter-btns .btn.primary{background:var(--paper); color:var(--ink)}
.icon-btn{width:38px; height:38px; border-radius:4px; border:1.5px dashed var(--line); background:transparent; display:grid; place-items:center; cursor:pointer; color:var(--faded); flex:none}
.icon-btn:hover{color:var(--ink); border-color:var(--ink)}
svg.i{width:18px; height:18px; flex:none}
.actions-row{display:grid; grid-template-columns:1fr auto; gap:10px; margin-bottom:18px}

/* Listen */
.card{background:var(--paper); padding:16px}
.stack{display:grid; gap:14px}
.order-card{display:grid; gap:6px; text-decoration:none; color:var(--ink)}
.order-card:hover .oc-name{text-decoration:underline}
.oc-top{display:flex; align-items:baseline; gap:8px}
.oc-name{font-weight:700; font-size:1rem; flex:1; min-width:0; overflow-wrap:anywhere; text-transform:uppercase; letter-spacing:.03em}
.oc-meta{font-size:.8rem; color:var(--faded)}
.oc-meta b{color:var(--ink)}
.oc-foot{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.78rem; color:var(--faded); flex-wrap:wrap}
.progress{height:8px; border:1.5px solid var(--ink); border-radius:2px; overflow:hidden; background:repeating-linear-gradient(90deg, transparent 0 6px, var(--line) 6px 7px)}
.progress span{display:block; height:100%; background:var(--ink)}
.badge{font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding:1px 6px; border:1.5px solid var(--red); color:var(--red); border-radius:2px; vertical-align:middle}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700; padding:2px 8px; white-space:nowrap; text-transform:uppercase; letter-spacing:.04em; border-radius:2px}
.pill.warn{background:var(--hi); color:var(--ink)}
.pill.ok{border:1.5px solid var(--ok); color:var(--ok)}
.pill.acc{border:1.5px solid var(--ink)}
.avatar{display:none}
.empty{text-align:center; color:var(--faded); padding:22px 8px}
.hint{font-size:.78rem; color:var(--faded)}

/* Beleg einer Bestellung */
.back{display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-weight:600; font-size:.82rem; margin:0 0 12px; color:var(--paper); text-transform:uppercase; letter-spacing:.05em}
.r-head{text-align:center; display:grid; gap:4px}
.r-sub{font-size:.78rem; color:var(--faded); letter-spacing:.04em}
.payer{display:grid; justify-items:center; text-align:center; gap:6px; margin:16px 0 4px}
.eyebrow{font-size:.7rem; text-transform:uppercase; letter-spacing:.14em; color:var(--faded); font-weight:600}
.payer-name{font-size:1.45rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--red); border:3px double var(--red); padding:4px 16px; transform:rotate(-2deg); border-radius:3px; overflow-wrap:anywhere}
.payinfo{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px; flex-wrap:wrap}
.payinfo .mono{font-size:.8rem; overflow-wrap:anywhere}
.meta{color:var(--faded); font-size:.8rem}
.r-cols{display:flex; justify-content:space-between; font-size:.72rem; font-weight:700; letter-spacing:.1em; color:var(--faded); padding:0 0 4px}
.receipt{list-style:none; margin:0; padding:0}
.unit{display:flex; align-items:center; gap:6px; border-bottom:1px dashed var(--line)}
.unit:last-child{border-bottom:0}
.check{flex:1; min-width:0; display:flex; align-items:flex-start; gap:10px; padding:10px 2px; cursor:pointer}
.check input{position:absolute; opacity:0; width:1px; height:1px}
.box{width:22px; height:22px; border:2px solid var(--ink); border-radius:2px; flex:none; display:grid; place-items:center; margin-top:1px; background:var(--paper)}
.box svg{width:15px; height:15px; opacity:0; color:var(--paper)}
.check input:checked + .box{background:var(--ink)}
.check input:checked + .box svg{opacity:1}
.check input:focus-visible + .box{outline:2px dashed var(--red); outline-offset:3px}
.u-main{flex:1; min-width:0; display:grid; gap:3px}
.u-name{font-weight:600; overflow-wrap:anywhere; text-transform:uppercase; font-size:.9rem; letter-spacing:.02em}
.u-k{font-size:.72rem; color:var(--faded); font-weight:500; margin-left:4px}
.u-who{display:flex; flex-wrap:wrap; gap:4px; font-size:.74rem}
.chip{padding:0 6px; border:1px solid var(--line); border-radius:2px; color:var(--faded)}
.chip::before{content:"> "}
.chip.me{border-color:var(--ink); color:var(--ink); font-weight:700}
.chip.open{background:var(--hi); border-color:transparent; color:var(--ink)}
.chip.open::before{content:""}
.u-price{text-align:right; font-weight:600; white-space:nowrap; font-size:.9rem}
.u-price small{display:block; font-size:.7rem; color:var(--faded); font-weight:500}
.unit.is-mine .u-name{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px}
.extras{list-style:none; margin:0; padding:0; display:grid; gap:2px; font-size:.86rem}
.extras li{display:flex; justify-content:space-between; gap:10px}
.r-total{display:flex; justify-content:space-between; align-items:baseline; font-weight:700; font-size:1.25rem; letter-spacing:.04em}
.r-lines{display:grid; gap:2px; font-size:.82rem; margin-top:6px}
.r-lines div{display:flex; justify-content:space-between; gap:10px}
.r-lines .open{background:var(--hi)}
.r-sec{text-align:center; margin:2px 0 10px; letter-spacing:.12em}
.r-sec::before,.r-sec::after{content:" * "; color:var(--faded)}
.barcode{height:46px; margin:18px auto 4px; width:72%; background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px, var(--ink) 12px 13px, transparent 13px 16px)}
.r-foot{text-align:center; font-size:.72rem; letter-spacing:.12em; color:var(--faded); text-transform:uppercase}

/* Abrechnung */
.settle{width:100%; border-collapse:collapse; font-size:.86rem}
.settle th{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--faded); text-align:left; padding:0 2px 6px; font-weight:700; border-bottom:1.5px solid var(--ink)}
.settle th:nth-child(2), .settle td:nth-child(2){text-align:right}
.settle th:last-child, .settle td:last-child{text-align:right; white-space:nowrap}
.settle td{padding:8px 2px; border-bottom:1px dashed var(--line); vertical-align:top}
.settle .who{font-weight:700; text-transform:uppercase}
.settle .what{font-size:.72rem; color:var(--faded); font-weight:400; margin-top:2px}
.settle tr.is-me .who::before{content:"► "}
.settle .amt{font-weight:600; white-space:nowrap}
.status-btn{border:1.5px solid var(--ink); background:transparent; border-radius:2px; padding:3px 8px; font-size:.7rem; font-weight:700; cursor:pointer; white-space:nowrap; text-transform:uppercase; letter-spacing:.06em}
.status-btn.open{background:var(--hi); border-color:var(--hi)}
.status-btn.paid{color:var(--ok); border-color:var(--ok); transform:rotate(-3deg)}
.status-btn.paid::before{content:"✓ "}
.settle-foot{display:flex; justify-content:space-between; gap:10px; padding-top:10px; border-top:3px double var(--ink); margin-top:6px; font-weight:700; text-transform:uppercase; font-size:.86rem}
.row-actions{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 8px}
.row-actions .btn:not(.danger){background:transparent; color:var(--paper); border-color:var(--paper); box-shadow:0 3px 0 #0008}
.row-actions .btn.danger{background:transparent; color:#F08A80; border-color:#F08A80; box-shadow:none; border-style:dashed}
.receipt-img{display:grid; gap:8px}
.receipt-img img{max-width:100%; border:1px solid var(--line)}

/* Schulden */
.sum-tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px}
.tile .k{font-size:.7rem; color:var(--faded); font-weight:700; text-transform:uppercase; letter-spacing:.08em}
.tile .v{font-size:1.3rem; font-weight:700}
.tile.warn .v{background:var(--hi); display:inline-block; padding:0 4px}
.tile.ok .v{color:var(--ok)}
.pair{display:grid; gap:6px}
.pair-head{display:flex; align-items:center; gap:8px; justify-content:space-between; padding-bottom:6px; border-bottom:1.5px solid var(--ink)}
.pair-names{font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap; text-transform:uppercase}
.pair-names svg{width:16px; height:16px}
.pair-line{display:flex; align-items:center; gap:10px; font-size:.82rem; border-bottom:1px dashed var(--line); padding:6px 0}
.pair-line:last-child{border-bottom:0}
.pair-line a{flex:1; min-width:0; color:var(--ink); text-decoration:none; overflow-wrap:anywhere}
.pair-line a:hover{text-decoration:underline}
.toggle-line{display:flex; align-items:center; gap:8px; font-size:.8rem; color:#D9D5CB; margin:0 2px 12px}
.toggle-line input{accent-color:var(--paper)}
.counter-text{color:#D9D5CB}

/* Kassendisplay unten */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:#121413; color:#E9F7A6; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:3px solid #000}
.bar[hidden]{display:none}
.bar-inner{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px}
.bar-text{flex:1; min-width:0}
.bar-k{font-size:.7rem; opacity:.75; font-weight:600; text-transform:uppercase; letter-spacing:.1em}
.bar-v{font-size:1.7rem; font-weight:700; line-height:1.15; letter-spacing:.04em; text-shadow:0 0 10px rgba(233,247,166,.35)}
.bar .btn{background:transparent; color:#E9F7A6; border-color:#E9F7A6; box-shadow:0 3px 0 #000}
.bar .btn.primary{background:#E9F7A6; color:#121413}
.bar .pill.warn{background:var(--hi)}
.bar-btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}

/* Sheet (Dialog) */
.sheet-wrap{position:fixed; inset:0; z-index:40; background:rgba(12,13,13,.6); display:flex; align-items:flex-end; justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--paper); width:100%; max-width:560px; max-height:92%; display:flex; flex-direction:column; border-radius:2px 2px 0 0}
@media (min-width:700px){ .sheet-wrap{align-items:center} .sheet{max-height:88%} }
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px 10px; border-bottom:2px dashed var(--line)}
.sheet-body{overflow:auto; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); display:grid; gap:14px; -webkit-overflow-scrolling:touch}
.field{display:grid; gap:4px}
.field label, .lbl{font-size:.7rem; font-weight:700; color:var(--faded); text-transform:uppercase; letter-spacing:.08em}
.input{width:100%; border:0; border-bottom:2px dotted var(--ink); background:transparent; border-radius:0; padding:8px 2px; min-height:42px; font-size:16px; font-family:var(--font-mono)}
.input:focus{outline:none; border-bottom-style:solid; background:rgba(243,226,122,.3)}
select.input{appearance:auto}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end}
.erows{display:grid; gap:2px}
.erow{display:grid; grid-template-columns:44px 1fr 86px 38px; gap:6px; align-items:center}
.erow .input{padding:6px 2px; min-height:40px}
.erow .p{text-align:right}
.erow .q{text-align:center}
.erow .ltot{grid-column:2 / 4; text-align:right; font-size:.76rem; font-weight:600; margin-top:-2px}
.erow .ltot:empty{display:none}
.erow-head{display:grid; grid-template-columns:44px 1fr 86px 38px; gap:6px; font-size:.66rem; color:var(--faded); font-weight:700; text-transform:uppercase; letter-spacing:.08em}
.erow-head span:nth-child(3){text-align:right}
.sumline{display:flex; justify-content:space-between; gap:10px; font-size:.82rem; padding:8px 0; border-top:3px double var(--ink); flex-wrap:wrap}
.sumline.bad{background:var(--hi); padding:8px}
details.raw summary{cursor:pointer; font-size:.78rem; color:var(--faded); font-weight:600; text-transform:uppercase; letter-spacing:.06em}
details.raw pre{white-space:pre-wrap; font-size:.74rem; border:1px dashed var(--line); padding:10px; max-height:240px; overflow:auto}
.thumbs{display:flex; gap:8px; overflow-x:auto}
.thumbs img{height:110px; border:1px solid var(--line)}
.name-list{display:grid; gap:0}
.name-opt{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px dashed var(--line); cursor:pointer; text-transform:uppercase; font-weight:600}
button.name-opt{width:100%; background:none; border:0; border-bottom:1px dashed var(--line); color:var(--ink); text-align:left; font-size:1rem; min-height:48px}
button.name-opt:hover{background:rgba(243,226,122,.35)}
button.name-opt.cur::before{content:"► "}
.name-opt input{width:20px; height:20px; accent-color:var(--ink)}
.quick{display:flex; flex-wrap:wrap; gap:8px}
.progress-big{height:14px; border:2px solid var(--ink); overflow:hidden}
.progress-big span{display:block; height:100%; width:0; background:repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 10px); transition:width .2s}
.progress-big.indet span{width:35%; animation:indet 1.3s linear infinite}
@keyframes indet{from{transform:translateX(-110%)} to{transform:translateX(320%)}}
.share-row{display:flex; justify-content:center; margin-top:12px}
.share-url{font-size:.78rem; border:1.5px dashed var(--line); padding:8px 10px; overflow-wrap:anywhere; user-select:all; -webkit-user-select:all}
.share-btns{display:grid; gap:10px}
.sheet-foot{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

.crop-wrap{display:flex; justify-content:center}
.crop{position:relative; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; line-height:0}
.crop img{display:block; max-width:100%; max-height:58vh; pointer-events:none}
.crop-box{position:absolute; border:2px solid var(--red)}
.crop-shade{position:absolute; background:rgba(20,20,20,.6); pointer-events:none}
.crop-h{position:absolute; width:34px; height:34px; touch-action:none; cursor:grab}
.crop-h::after{content:""; position:absolute; inset:9px; background:var(--paper); border:3px solid var(--red)}
.crop-h.tl{left:-17px; top:-17px} .crop-h.tr{right:-17px; top:-17px} .crop-h.bl{left:-17px; bottom:-17px} .crop-h.br{right:-17px; bottom:-17px}
.toast{position:fixed; left:50%; bottom:calc(132px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--paper); color:var(--ink); border:2px solid var(--ink); padding:8px 14px; font-size:.82rem; z-index:60; max-width:calc(100% - 32px); box-shadow:0 4px 0 var(--ink)}
.toast[hidden]{display:none}
.footer-hint{margin:24px 0; font-size:.76rem; color:#BDB8AC; text-align:center}
.footer-hint .btn{background:transparent; color:var(--paper); border-color:var(--paper)}
@media (max-width:420px){
  .actions-row{grid-template-columns:1fr}
  .bar-v{font-size:1.4rem}
  .paper{padding-left:14px; padding-right:14px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} .btn:active{transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top paper">
    <a class="brand" href="#bestellungen"><span class="brand-name">SYNAFOOD</span><span class="brand-sub">*** WER HATTE WAS? ***</span></a>
    <button class="me-pill" id="mePill" data-action="set-name" type="button"></button>
  </header>
  <div id="banner"></div>
  <main id="app"></main>
</div>

<div class="bar" id="bar" hidden></div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" type="button" data-action="close-sheet" aria-label="Schließen"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileInput" accept="image/*,application/pdf,.pdf" multiple hidden>

<script>
'use strict';
/* Gemeinsame Logik: wird vom Synafood-Server 1:1 wiederverwendet (nicht umbenennen). */
/*REDUCER-START*/
function nameKey(n){ return String(n || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function unitKeys(order){
  const keys = [];

function computeOrder(o, claims = {}, paid = {}){
  const people = new Map();

  const units = []; let itemsSubtotal = 0, unitsClaimed = 0;
  for (const it of (o.items || [])) {
    const q = Math.max(1, Math.min(50, it.qty | 0)); const up = (it.price || 0) / q; itemsSubtotal += (it.price || 0);
    for (let k = 0; k < q; k++) {

      units.push({unit, item:it, k, q, price:up, names});

      }

  const extrasTotal = (o.extras || []).reduce((a, e) => a + (e.price || 0), 0);
  const list = [...people.values()];
  for (const p of list) {
    p.extrasC = o.feeMode === 'equal' ? (list.length ? extrasTotal / list.length : 0) : (itemsSubtotal ? extrasTotal * p.itemsC / itemsSubtotal : 0);
    p.total = Math.round(p.itemsC + p.extrasC);
    p.isPayer = p.key === nameKey(o.payer);
    p.paid = !!paid[p.key];
  }
  list.sort((a, b) => (b.isPayer - a.isPayer) || a.name.localeCompare(b.name, 'de'));
  const grand = itemsSubtotal + extrasTotal;
  const assigned = list.reduce((a, p) => a + p.total, 0);

function viewDebts(){
  const mk = nameKey(me); const pairs = new Map(); let iOwe = 0, iGet = 0;
  for (const o of sortedOrders()) {
    const c = computeOrder(o, Store.state.claims[o.id], Store.state.paid[o.id]);
    for (const p of c.people) {
      if (p.isPayer || p.total <= 0) continue;
      const key = p.key + '>' + nameKey(o.payer);
      if (!pairs.has(key)) pairs.set(key, {from:p.name, fromKey:p.key, to:o.payer, toKey:nameKey(o.payer), open:0, lines:[]});
      const g = pairs.get(key); g.lines.push({o, p}); if (!p.paid) g.open += p.total;
      if (!p.paid && p.key === mk) iOwe += p.total;
      if (!p.paid && nameKey(o.payer) === mk) iGet += p.total;
    }
  }
  let h = '';
  if (me) h += '<div class="sum-tiles"><div class="paper tile ' + (iOwe ? 'warn' : 'ok') + '"><div class="k">Du musst noch zahlen</div><div class="v">' + fmt(iOwe) + '</div></div><div class="paper tile"><div class="k">Du bekommst noch</div><div class="v">' + fmt(iGet) + '</div></div></div>';
  h += '<label class="toggle-line"><input type="checkbox" data-toggle="paid"' + (showPaid ? ' checked' : '') + '> Erledigte anzeigen</label>';
  const groups = [...pairs.values()].filter(g => showPaid || g.open > 0)
    .sort((a, b) => ((b.fromKey === mk || b.toKey === mk) - (a.fromKey === mk || a.toKey === mk)) || b.open - a.open);
  if (!groups.length) return h + '<p class="empty counter-text">Niemand schuldet gerade jemandem etwas.</p>';
  h += '<div class="stack">';
  for (const g of groups) {
    h += '<section class="paper pair"><div class="pair-head"><span class="pair-names">' + esc(g.from) + ICON.arrow + esc(g.to) + '</span><span class="mono"><b>' + fmt(g.open) + '</b></span></div>';
    for (const {o, p} of g.lines) {
      if (!showPaid && p.paid) continue;
      h += '<div class="pair-line"><a href="#o-' + esc(o.id) + '">' + esc(o.restaurant || 'Bestellung') + ' · ' + esc(fmtDate(o.date)) + '</a><span class="mono">' + fmt(p.total) + '</span><button class="status-btn ' + (p.paid ? 'paid' : 'open') + '" type="button" data-action="paid" data-order="' + esc(o.id) + '" data-name="' + esc(p.name) + '" data-on="' + (p.paid ? '0' : '1') + '">' + (p.paid ? 'bezahlt' : 'offen') + '</button></div>';
    }
    h += '</section>';
  }
  return h + '</div>';
}

async function startScan(files){
  const prepared = [];
  for (let i = 0; i < files.length; i++) {
    let img; try { img = await loadImage(files[i]); } catch { toast('Das Bild konnte nicht geöffnet werden.'); return; }
    const box = await openCrop(img, detectPaper(img), i, files.length);
    if (!box) return;
    prepared.push({img, box});
  }
  const thumbs = prepared.map(p => cropThumb(p.img, p.box));
  if (await tryLlm(prepared.map(p => llmImage(p.img, p.box)), thumbs, 'Kassenzettel prüfen')) return;
  openSheet('Kassenzettel wird gelesen', '<p class="hint" id="ocrStatus" style="margin:0">Wird vorbereitet …</p><div class="progress-big"><span id="ocrBar"></span></div><p class="hint" style="margin:0">Beim ersten Scan lädt die Texterkennung einmalig ihre Sprachdaten (ca. 10 MB). Danach geht es schneller.</p>', {kind:'ocr'});
  try {
    const texts = await runOcr(prepared, (msg, p) => { const s = $('#ocrStatus'), b = $('#ocrBar'); if (s) s.textContent = msg; if (b) b.style.width = Math.round(Math.max(0.03, Math.min(1, p)) * 100) + '%'; });
    if (!sheetState || sheetState.kind !== 'ocr') return;
    openParsed(mergeParses(texts.map(parseReceipt)), texts[0], thumbs, 'Kassenzettel prüfen');
  } catch (e) {
    if (!sheetState || sheetState.kind !== 'ocr') return;
    $('#sheetBody').innerHTML = '<p style="margin:0">Die Texterkennung konnte nicht geladen werden. Dafür braucht das Handy beim ersten Scan Internet.</p><p class="hint" style="margin:0">Du kannst die Gerichte trotzdem von Hand eintragen, das Foto wird mitgespeichert.</p><div class="sheet-foot"><button class="btn" type="button" data-action="close-sheet">Abbrechen</button><button class="btn primary" type="button" data-action="manual-after-fail">Von Hand eintragen</button></div>';
    sheetState.thumbs = thumbs;
  }
}

let serverLlm = null;
function llmConfig(){
  if (serverLlm) return {via:'server', model:serverLlm.model};
  const c = LS.get('synafood-llm', null);
  return c && c.enabled !== false && c.url && c.model ? {via:'direct', ...c} : null;
}
function llmImage(img, box){
  const sx = box.x0 * img.width, sy = box.y0 * img.height, sw = (box.x1 - box.x0) * img.width, sh = (box.y1 - box.y0) * img.height;
  const s = Math.min(1, 1100 / sw, 2600 / sh); const c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.86);
}
async function scanWithLlm(images){
  const cfg = llmConfig();
  if (cfg.via === 'server') {
    const r = await fetch('api/scan', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({images})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('Server antwortet mit ' + r.status));
    return j.text;
  }
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 240000);
  try { return await llmScan(cfg, images, ctrl.signal); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'Zeitüberschreitung' : (e instanceof TypeError ? 'Modell nicht erreichbar (Adresse, CORS oder http/https prüfen)' : e.message)); }
  finally { clearTimeout(t); }
}
function parseLlmJson(text){
  let t = String(text || '').replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```(?:json)?/gi, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a < 0 || b < a) throw new Error('Antwort enthält kein JSON');
  let j; const raw = t.slice(a, b + 1);
  try { j = JSON.parse(raw); } catch { j = JSON.parse(raw.replace(/,\s*([}\]])/g, '$1')); }
  const money = v => typeof v === 'number' ? Math.round(v * 100) : toCents(v);
  const items = (j.positionen || j.items || []).map(p => ({id:uid('i'), name:String(p.name || p.bezeichnung || '').trim().slice(0, 80), qty:Math.max(1, Math.min(50, parseInt(p.menge ?? p.qty ?? 1, 10) || 1)), price:money(p.preis ?? p.price ?? 0)})).filter(i => i.name && i.price);
  const extras = (j.gebuehren || j.extras || []).map(e => ({id:uid('e'), name:String(e.name || 'Gebühr').trim().slice(0, 60), price:money(e.betrag ?? e.price ?? 0)})).filter(e => e.price);
  let date = String(j.datum || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { const d = date.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); date = d ? (d[3].length === 2 ? '20' + d[3] : d[3]) + '-' + d[2].padStart(2, '0') + '-' + d[1].padStart(2, '0') : ''; }
  const k = String(j.kunde || '').trim().split(/\s+/)[0] || '';
  const total = j.gesamt != null && j.gesamt !== '' ? Math.abs(money(j.gesamt)) || null : null;
  return {restaurant:String(j.restaurant || '').trim().slice(0, 60), date, payer: k ? k[0].toUpperCase() + k.slice(1).toLowerCase() : '', items, extras, total};
}
function openParsed(parsed, raw, thumbs, title){
  if (!parsed.items.length) toast('Keine Gerichte erkannt – bitte von Hand eintragen.');
  const payer = matchPerson(parsed.payer) || me;
  openEditor(newDraft({...parsed, payer, receiptTotal:parsed.total, raw, thumbs, isNew:true}), title);
}
// Liefert true, wenn die KI ein Ergebnis geliefert hat; sonst übernimmt die lokale Texterkennung.
async function tryLlm(images, thumbs, title){
  const cfg = llmConfig(); if (!cfg) return false;
  openSheet('KI liest den Bon', '<p class="hint" style="margin:0">Das Bild geht an <b style="color:var(--ink)">' + esc(cfg.model) + '</b>' + (cfg.via === 'server' ? ' (über den Synafood-Server)' : '') + '. Je nach Rechner dauert das 10 bis 90 Sekunden.</p><div class="progress-big indet"><span></span></div><div class="sheet-foot"><button class="btn" type="button" data-action="llm-skip">Lokale Texterkennung nutzen</button></div>', {kind:'ocr', llm:true});
  try {
    const skip = new Promise(res => { sheetState.skip = () => res(null); });
    const job = scanWithLlm(images); job.catch(() => {});
    const text = await Promise.race([job, skip]);
    if (text === null) return false;
    if (!sheetState || sheetState.kind !== 'ocr') return true;
    const parsed = parseLlmJson(text);
    if (!parsed.items.length) throw new Error('keine Gerichte erkannt');
    openParsed(parsed, text, thumbs, title); return true;
  } catch (e) {
    if (!sheetState || sheetState.kind !== 'ocr' || !sheetState.llm) return true;
    toast('KI-Scan fehlgeschlagen: ' + (e.message || e) + '. Lokale Texterkennung übernimmt.');
    return false;
  }
}

/* ---------- PDF-Belege (z. B. Lieferando-Bestellbestätigung als PDF gespeichert) ---------- */
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
let pdfjsLib = null;
async function loadPdfJs(){
  if (pdfjsLib) return pdfjsLib;
  const lib = await import(PDFJS_BASE + 'pdf.min.mjs');
  try {
    const code = await (await fetch(PDFJS_BASE + 'pdf.worker.min.mjs')).text();
    lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], {type:'text/javascript'}));
  } catch { lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.mjs'; }
  return (pdfjsLib = lib);
}
// Setzt die Textstücke einer PDF-Seite wieder zu Zeilen zusammen (Name links, Preis rechts → eine Zeile).
function pdfLines(items){
  const parts = items.filter(i => i.str && i.str.trim()).map(i => ({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width || 0, h:Math.abs(i.transform[3]) || i.height || 10}));
  parts.sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for (const p of parts) {
    const line = lines.find(l => Math.abs(l.y - p.y) <= Math.max(2, Math.min(l.h, p.h) * 0.45));
    if (line) line.parts.push(p); else lines.push({y:p.y, h:p.h, parts:[p]});
  }
  lines.sort((a, b) => b.y - a.y);
  return lines.map(l => {
    l.parts.sort((a, b) => a.x - b.x);
    let out = '', end = null;
    for (const p of l.parts) { if (end !== null) out += (p.x - end > p.h * 0.18 ? ' ' : ''); out += p.s; end = p.x + p.w; }
    return out.replace(/[−–]/g, '-').replace(/\s+/g, ' ').trim();
  }).filter(Boolean).join('\n');
}
async function renderPdfPage(doc, n, scale){
  const page = await doc.getPage(n); const vp = page.getViewport({scale});
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({canvasContext:ctx, viewport:vp}).promise; return c;
}
async function startPdf(file){
  openSheet('PDF wird gelesen', '<p class="hint" id="ocrStatus" style="margin:0">PDF wird geöffnet …</p><div class="progress-big"><span id="ocrBar" style="width:10%"></span></div>', {kind:'ocr'});
  const status = (msg, p) => { const s = $('#ocrStatus'), b = $('#ocrBar'); if (s) s.textContent = msg; if (b) b.style.width = Math.round(Math.max(0.05, Math.min(1, p)) * 100) + '%'; };
  let doc;
  try { const lib = await loadPdfJs(); doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise; }
  catch (e) {
    if (!sheetState || sheetState.kind !== 'ocr') return;
    $('#sheetBody').innerHTML = '<p style="margin:0">Das PDF konnte nicht geöffnet werden. Beim ersten Mal braucht das Handy Internet, um den PDF-Leser zu laden. Passwortgeschützte PDFs gehen nicht.</p><div class="sheet-foot"><button class="btn" type="button" data-action="close-sheet">Abbrechen</button><button class="btn primary" type="button" data-action="manual-after-fail">Von Hand eintragen</button></div>';
    return;
  }
  const pages = Math.min(doc.numPages, 4); let text = ''; const thumbs = [];
  for (let n = 1; n <= pages; n++) {
    status('Seite ' + n + ' von ' + pages + ' wird gelesen …', n / (pages + 1));
    const page = await doc.getPage(n); const tc = await page.getTextContent(); text += pdfLines(tc.items) + '\n';
    if (thumbs.length < 2) thumbs.push((await renderPdfPage(doc, n, 1.4)).toDataURL('image/jpeg', 0.72));
  }
  if (!sheetState || sheetState.kind !== 'ocr') return;
  let parsed;
  if (letterCount(text) >= 30) parsed = parseReceipt(text);
  else {
    // PDF enthält nur ein Bild (gescannt): Seiten rendern und per Texterkennung lesen
    const prepared = [];
    for (let n = 1; n <= pages; n++) prepared.push({img: await renderPdfPage(doc, n, 3), box:{x0:0, y0:0, x1:1, y1:1}});
    if (await tryLlm(prepared.map(p => llmImage(p.img, p.box)), thumbs, 'Beleg prüfen')) return;
    openSheet('PDF wird gelesen', '<p class="hint" id="ocrStatus" style="margin:0">Texterkennung läuft …</p><div class="progress-big"><span id="ocrBar" style="width:5%"></span></div>', {kind:'ocr'});
    try { const texts = await runOcr(prepared, status); text = texts[0]; parsed = mergeParses(texts.map(parseReceipt)); }
    catch { parsed = {restaurant:'', date:'', payer:'', items:[], extras:[], total:null}; }
    if (!sheetState || sheetState.kind !== 'ocr') return;
  }
  if (!parsed.items.length) toast('Keine Gerichte erkannt – bitte von Hand eintragen.');
  const payer = parsed.payer ? (knownNames().find(n => nameKey(n) === nameKey(parsed.payer)) || parsed.payer) : me;
  openEditor(newDraft({...parsed, payer, receiptTotal:parsed.total, raw:text, thumbs, isNew:true}), 'Beleg prüfen');
}

  },
  'delete-confirm': el => { const id = el.dataset.id; closeSheet(); Store.delImgs(id); Store.dispatch({type:'deleteOrder', id}); location.hash = '#bestellungen'; toast('Bestellung gelöscht'); },
  'row-add': el => { const list = el.dataset.list; draft[list].push(list === 'items' ? {id:uid('i'), name:'', qty:1, unitText:'', total:0} : {id:uid('e'), name:'', priceText:''}); renderRows(); updateSum(); const rows = document.querySelectorAll('#' + (list === 'items' ? 'itemRows' : 'extraRows') + ' .erow'); const last = rows[rows.length - 1]; if (last) last.querySelector('[data-rf="name"]').focus(); },
  'row-del': el => { draft[el.dataset.list].splice(+el.dataset.i, 1); renderRows(); updateSum(); },
  install: async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.claim) {
    const r = route(); const on = t.checked;
    if (!me) { t.checked = !on; return openNameSheet(() => Store.dispatch({type:'setClaim', orderId:r.id, unit:t.dataset.claim, name:me, on:true})); }
    Store.dispatch({type:'setClaim', orderId:r.id, unit:t.dataset.claim, name:me, on});
  } else if (t.dataset.assignName) {
    Store.dispatch({type:'setClaim', orderId:sheetState.orderId, unit:sheetState.unit, name:t.dataset.assignName, on:t.checked}); renderAssign();
  } else if (t.dataset.toggle === 'paid') { showPaid = t.checked; render(); }
  else if (t.dataset.f === 'feeMode' && draft) draft.feeMode = t.value;
});
document.addEventListener('input', e => {
  const t = e.target; if (!draft) return;
  if (t.dataset.f) { draft[t.dataset.f] = t.dataset.f === 'receiptTotal' ? (t.value.trim() ? toCents(t.value) : null) : t.value; if (t.dataset.f === 'receiptTotal') updateSum(); }
  else if (t.dataset.rf) {
    const row = t.closest('.erow'); const r = draft[row.dataset.list][+row.dataset.i]; if (!r) return;
    r[t.dataset.rf] = t.value;
    if (row.dataset.list === 'items' && (t.dataset.rf === 'qty' || t.dataset.rf === 'unitText')) {
      r.total = Math.round(toCents(r.unitText) * Math.max(1, Math.min(50, parseInt(r.qty, 10) || 1)));
      const lt = row.querySelector('.ltot'); if (lt) lt.textContent = lineTotalText(r);
    }
    updateSum();
  }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'name') { if (!setMe($('#nameInput').value)) toast('Bitte einen Namen eingeben.'); }
  else if (f === 'editor') saveDraft();
  else if (f === 'user-add') {
    const n = $('#userNew').value.trim(); if (!n) return;
    if ((Store.state.users || []).some(u => nameKey(u.name) === nameKey(n))) { renderUsers('„' + n + '“ gibt es schon.'); return; }
    adminDispatch({type:'addUser', id:uid('u'), name:n}).then(ok => { const i = $('#userNew'); if (i && ok) i.focus(); });
  }
  else if (f === 'llm') { const c = readLlmForm(); if (!c.url || !c.model) { toast('Bitte Adresse und Modell eintragen.'); return; } LS.set('synafood-llm', c); closeSheet(); render(); toast('KI-Scanner gespeichert'); }
  else if (f === 'assign-add') {
    const inp = $('#assignNew'); const n = inp.value.trim(); if (!n) return;
    Store.dispatch({type:'setClaim', orderId:sheetState.orderId, unit:sheetState.unit, name:n, on:true}); renderAssign();
  }
});
$('#fileInput').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  const pdf = files.find(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (pdf) startPdf(pdf); else startScan(files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name)));
});
window.addEventListener('hashchange', () => { if (!$('#sheetWrap').hidden) closeSheet(); render(); window.scrollTo(0, 0); if (pendingShare) { const s = pendingShare; pendingShare = null; openShareSheet(s); } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (route().view === 'list') render(); });

(async () => {
  await Store.init(); render();
  if (hasUsers() && !meOk()) openNameSheet();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && Store.mode === 'server') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
